<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card">

<div class="card-body">

<h3 class="mb-4 text-center">
One Click Benchmark
</h3>

<form method="post" action="/login">

<div class="mb-3">

<label>Login</label>

<input
class="form-control"
name="username">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
name="password">

</div>

<button
class="btn btn-primary w-100">

Sign in

</button>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
